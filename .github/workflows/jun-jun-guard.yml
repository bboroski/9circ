name: Jun-Jun Repository Guard
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jun-jun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read-only hygiene scan
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,sys
          files=subprocess.check_output(["git","ls-files","-z"]).split(b"\0")
          exts={".py",".c",".h",".cc",".cpp",".hpp",".rs",".go",".js",".ts",".tsx",".java",".cs",".sh",".ps1",".yml",".yaml",".toml",".json",".xml",".html"}
          secrets=[re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),re.compile(r"\bgithub_pat_[A-Za-z0-9_]{30,}\b"),re.compile(r"\bAKIA[0-9A-Z]{16}\b")]
          findings=[]; count=0
          for raw in files:
              if not raw: continue
              name=raw.decode("utf-8","replace"); p=pathlib.PurePosixPath(name)
              if ".git" in p.parts or p.suffix.lower() not in exts: continue
              try: data=pathlib.Path(name).read_bytes()
              except OSError: findings.append((name,"unreadable tracked file")); continue
              if len(data)>2_000_000 or b"\0" in data[:8192]: continue
              count+=1
              for n,line in enumerate(data.decode("utf-8","replace").splitlines(),1):
                  if re.match(r"^<<<<<<< |^>>>>>>> ",line): findings.append((name,f"merge marker line {n}"))
                  if any(x.search(line) for x in secrets): findings.append((name,f"credential marker line {n}"))
          if findings:
              for f,msg in findings: print(f"Jun-Jun: {f}: {msg}")
              sys.exit(1)
          print(f"Jun-Jun passed: {count} tracked source files inspected.")
          print("Hygiene only; project build, tests and hardware qualification are not implied.")
          PY
