[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninecirc"
version = "0.1.0"
description = "A local-first desktop studio for evidence-based repository improvement."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
9circ = "ninecirc.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
